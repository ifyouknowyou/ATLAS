# ATLAS local development infrastructure.
#
# Dedicated Postgres for ATLAS (does not touch NOVA/NEXUS containers).
# Redis + MinIO are included as forward-looking infra for later phases
# (realtime/evidence). Postgres is the only Phase 1 dependency.
version: "3.9"

services:
  atlas-postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    ports:
      - "5434:5432"
    volumes:
      - atlas-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  atlas-postgres-test:
    image: postgres:16-alpine
    container_name: atlas-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  atlas-redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-pg-data: